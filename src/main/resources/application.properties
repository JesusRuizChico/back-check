spring.application.name=habitacheck-backend

server.port=${PORT:8080}

# Base de datos PostgreSQL (docker-compose.yml o instalación local).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habitacheck_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true

# Imágenes de perfil y propiedades guardadas en el servidor.
habitacheck.almacenamiento.directorio=${UPLOADS_DIR:uploads}
habitacheck.almacenamiento.ruta-publica=/uploads

# Orígenes web permitidos (Flutter Web en desarrollo usa un puerto aleatorio de localhost).
habitacheck.cors.origenes-permitidos=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
