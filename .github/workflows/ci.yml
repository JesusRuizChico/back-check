name: CI Backend (back-check)
 
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}
 
jobs:
  build-and-test:
    name: Build y pruebas (Spring Boot)
    runs-on: ubuntu-latest
 
    # Base de datos real para las pruebas (JPA/Flyway), con la misma
    # configuración que docker-compose.yml usa en desarrollo local.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: habitacheck_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    env:
      DB_URL: jdbc:postgresql://localhost:5432/habitacheck_db
      DB_USER: postgres
      DB_PASSWORD: password
      # Las pruebas usan el perfil "test" (application-test.properties),
      # que lee estas variables en lugar de DB_*.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/habitacheck_db
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: password
 
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo
 
      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
 
      - name: Compilar (mvn compile)
        run: ./mvnw -B compile
 
      - name: Ejecutar pruebas con cobertura (mvn test + JaCoCo)
        run: ./mvnw -B test
 
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-backend
          path: target/surefire-reports/
          retention-days: 7
 
      - name: Análisis de calidad (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
 
      - name: Empaquetar (mvn package)
        if: github.event_name == 'push'
        run: ./mvnw -B package -DskipTests
 
      - name: Publicar el .jar generado
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7
 
  notificar-fallo:
    name: Notificar fallo (Discord)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: failure()
    steps:
      - name: Enviar mensaje al webhook de Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          AUTOR: ${{ github.actor }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg repo "$REPO" --arg rama "$RAMA" --arg autor "$AUTOR" \
            --arg evento "$EVENTO" --arg commit "${COMMIT:0:7}" --arg url "$URL_RUN" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: "❌ Falló el pipeline del backend",
                url: $url,
                color: 15158332,
                fields: [
                  {name: "Repositorio", value: $repo, inline: true},
                  {name: "Rama", value: $rama, inline: true},
                  {name: "Autor", value: $autor, inline: true},
                  {name: "Evento", value: $evento, inline: true},
                  {name: "Commit", value: $commit, inline: true}
                ],
                description: ("[Ver ejecución en GitHub Actions](" + $url + ")")
              }]
            }')
          curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
